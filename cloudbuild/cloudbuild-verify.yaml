steps:
  - id: 'verify-release-metadata'
    name: 'python:3.13-slim'
    entrypoint: 'python'
    args:
      - 'cloudbuild/scripts/verify-release-metadata.py'
      - '--metadata'
      - '${_METADATA_FILE}'
      - '--approved-registry'
      - '${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}'

substitutions:
  _LOCATION: us-central1
  _REPOSITORY: secure-delivery
  _METADATA_FILE: release-metadata.json

options:
  logging: CLOUD_LOGGING_ONLY
